name: Go CI/CD Build and Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.22'
        cache: false

    - name: Install dependencies
      run: go mod tidy

    - name: Ensure Go format (fmt)
      run: gofmt -s -w .

    - name: Build binary
      run: go build -v -o oracle-stream-studio .

    - name: Run tests
      run: go test -v -count=1 -timeout=120s ./...
      continue-on-error: true

    - name: Run golangci-lint (informational)
      continue-on-error: true
      uses: golangci/golangci-lint-action@v6
      with:
        version: v1.60.0
        args: --timeout=5m --disable-all --enable=govet,ineffassign,staticcheck

name: Go CI/CD Build and Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up latest stable Go
      uses: actions/setup-go@v5
      with:
        go-version: 'stable'
        cache: true

    - name: Install system ZeroMQ headers if needed & tidy modules
      run: go mod tidy

    - name: Verify Go formatting
      run: gofmt -s -w .

    - name: Build binary
      run: go build -v -ldflags="-s -w" -o oracle-stream-studio .

    - name: Run unit tests
      run: go test -v -count=1 -timeout=120s ./...

    - name: Run golangci-lint (informational)
      continue-on-error: true
      uses: golangci/golangci-lint-action@v6
      with:
        version: latest
        args: --timeout=5m --disable-all --enable=govet,ineffassign,staticcheck
